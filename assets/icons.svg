<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Icons for The Enterprise EPIC, drawn in the line style of Figure 1.1:
       24px grid, no fill. Stroke colour, width 1.4 and round caps come from
       the .ic class in site.css, so every icon follows the text beside it. -->

  <!-- The diagnostic: a ladder with one rung marked -->
  <symbol id="i-ladder" viewBox="0 0 24 24">
    <path d="M7 3v18M17 3v18M7 7h10M7 12h10M7 17h10"/>
    <circle cx="12" cy="12" r="1.8"/>
  </symbol>

  <!-- A canvas: an unrolled scroll with lines to fill -->
  <symbol id="i-scroll" viewBox="0 0 24 24">
    <path d="M7 4h11a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1H9a2 2 0 0 1-2-2V4z"/>
    <path d="M7 4a2 2 0 0 0-3 1.7V8h3"/>
    <path d="M10.5 9h6M10.5 12.5h6M10.5 16h3.5"/>
  </symbol>

  <!-- Download: a page dropping into a tray -->
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 3.5v10.5M7.8 10.2 12 14.4l4.2-4.2"/>
    <path d="M4 14.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/>
  </symbol>

  <!-- Request: an open hand beneath a scroll -->
  <symbol id="i-request" viewBox="0 0 24 24">
    <rect x="9" y="3" width="10" height="7" rx="1.5"/>
    <path d="M11.5 6h5"/>
    <path d="M3 14.5h3.5l2.3 1.4h4.4a1.5 1.5 0 0 1 0 3H9.5"/>
    <path d="M3 20h6.3l7.6-3.4a1.5 1.5 0 0 0-1.1-2.8l-2.3.8"/>
  </symbol>

  <!-- Opens in a new tab: an arrow leaving a box -->
  <symbol id="i-external" viewBox="0 0 24 24">
    <path d="M14 4h6v6M20 4l-8.5 8.5"/>
    <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
  </symbol>

  <!-- Copy link: two chain links -->
  <symbol id="i-link" viewBox="0 0 24 24">
    <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/>
    <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>
  </symbol>

  <!-- Copy result: overlapping pages -->
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/>
    <path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>
  </symbol>

  <!-- Retake: a circular arrow -->
  <symbol id="i-retake" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.35-5.65"/>
    <path d="M20 4v5h-5"/>
  </symbol>

  <!-- One decision: a flag -->
  <symbol id="i-flag" viewBox="0 0 24 24">
    <path d="M6 21V4"/>
    <path d="M6 4.5h11l-2.2 4 2.2 4H6"/>
  </symbol>

  <!-- One working session: an hourglass -->
  <symbol id="i-hourglass" viewBox="0 0 24 24">
    <path d="M6.5 3.5h11M6.5 20.5h11"/>
    <path d="M8 3.5c0 5 8 5 8 8.5s-8 3.5-8 8.5M16 3.5c0 5-8 5-8 8.5s8 3.5 8 8.5"/>
  </symbol>

  <!-- One Blueprint: stacked sheets -->
  <symbol id="i-sheets" viewBox="0 0 24 24">
    <rect x="7.5" y="3.5" width="12" height="15" rx="1.5"/>
    <path d="M4.5 7.5V19a2 2 0 0 0 2 2h9.5"/>
    <path d="M10.5 8h6M10.5 11h6M10.5 14h3.5"/>
  </symbol>

  <!-- The Dashboard Delusion: a cracked gauge -->
  <symbol id="i-gauge" viewBox="0 0 24 24">
    <path d="M3.5 17a8.5 8.5 0 0 1 17 0"/>
    <path d="M12 17l4.2-5.2"/>
    <path d="M8.2 7.6l1.6 2.3-1.3 1.4 1.4 1.9"/>
    <path d="M3.5 20.5h17"/>
  </symbol>

  <!-- The Question Graph: one question branching into three -->
  <symbol id="i-branch" viewBox="0 0 24 24">
    <circle cx="5.5" cy="12" r="2.5"/>
    <path d="M8 12h3.5M11.5 12 16.5 6M11.5 12h5M11.5 12l5 6"/>
    <circle cx="18.5" cy="6" r="1.7"/>
    <circle cx="18.5" cy="12" r="1.7"/>
    <circle cx="18.5" cy="18" r="1.7"/>
  </symbol>

  <!-- Warranted Confidence: a gateway with a check -->
  <symbol id="i-gate" viewBox="0 0 24 24">
    <path d="M5 20.5V10a7 7 0 0 1 14 0v10.5"/>
    <path d="M3 20.5h18"/>
    <path d="M9 13.2l2.2 2.2 4-4"/>
  </symbol>

  <!-- A note to the author: a folded letter -->
  <symbol id="i-letter" viewBox="0 0 24 24">
    <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
    <path d="M3.6 6.5 12 12.5l8.4-6"/>
  </symbol>

  <!-- In the book: an open book -->
  <symbol id="i-book" viewBox="0 0 24 24">
    <path d="M12 6.2C10 4.8 7 4.3 4 4.8v14c3-.5 6 0 8 1.4 2-1.4 5-1.9 8-1.4v-14c-3-.5-6 0-8 1.4z"/>
    <path d="M12 6.2v14"/>
  </symbol>
</svg>
